name: Security Scanning Post-Checks
description: This action runs security scanning post-checks on the codebase.

inputs:
  image-tag:
    description: 'Image tag to scan.'
    required: false
outputs:
  trivy-report:
    description: 'Path to the generated Trivy JSON report'
    value: trivy-report-postscan-postscan.json

runs:
  using: "composite"
  steps:
    - name: Install Security Tools
      shell: bash
      run: |
        echo "Installing Trivy..."
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

        echo "Verifying installations..."
        trivy --version
    
    - name: Run Trivy Scan (Vulnerabilities and Misconfigurations)
      shell: bash
      run: |
        echo "Running Trivy scan on $SCAN_TARGET..."
        trivy image --scanners vuln,config,secret --format json --output trivy-report-postscan.json "${{ inputs.image-tag }}"
    
    - name: Upload Scan Reports
      uses: actions/upload-artifact@v7
      with:
        name: security-scan-reports
        path: |
          trivy-report-postscan.json