name: Day 2 CI
run-name: ${{ github.actor }} - running workflow

permissions:
  contents: read

env:
  APP_NAME: podpoll
  REGISTRY: ghcr.io

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version to run the tests with'
        required: true
        default: '3.12'
        type: choice
        options:
          - '3.12'
          - '3.13'
      push-images:
        description: 'Push the images to GHCR (never happens for pull requests)'
        required: true
        default: true
        type: boolean
      fail-on-findings:
        description: 'Fail the run on blocking security findings'
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '0 7 * * 1'

jobs:
  # Gitleaks + TruffleHog on the whole git history, Trivy on the files (dependencies, secrets,
  # Dockerfiles, Kubernetes manifests). Fails the run on blocking findings unless switched off.
  prescan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      blocking: ${{ steps.prescan.outputs.blocking-findings }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0              # the secret scanners read the full history
          persist-credentials: false

      - name: Prescan Security Checks
        id: prescan
        uses: ./.github/prescan
        with:
          scan-path: ${{ github.workspace }}
          fail-on-findings: ${{ inputs.fail-on-findings != false && 'true' || 'false' }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version || '3.12' }}
          cache: 'pip'
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Set up Node.js (frontend unit tests)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # API (incl. Postgres integration tests in a container), node-agent, scripts, frontend logic
      - name: Run all test suites with a JUnit report
        id: run-tests
        env:
          PYTHON: python   # the interpreter setup-python just installed
        run: scripts/test.sh --junitxml="$GITHUB_WORKSPACE/reports/junit.xml"

      - name: Upload JUnit test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: |
            reports/junit.xml
            api/coverage.xml
          retention-days: 5

      - name: Notify on test failure
        if: failure() && steps.run-tests.outcome == 'failure'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "🚨 Tests failed on $BRANCH_NAME"

  # Build each image, scan it with the postscan action BEFORE it leaves the runner, and push
  # only if the scan passed and this is not a pull request.
  build:
    name: build (${{ matrix.component }})
    needs: [prescan, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, frontend, node-agent]
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # APP_VERSION, GIT_SHA, GIT_REF, BUILD_ID, BUILD_URL, CI_SYSTEM, BUILD_TIME, SOURCE_URL, IMAGE_TAG
      - name: Compute version and build provenance
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.component }}
        run: |
          scripts/version.sh > build.env
          cat build.env >> "$GITHUB_ENV"
          # shellcheck disable=SC1091
          source build.env
          echo "IMAGE=${REGISTRY}/${OWNER,,}/podpoll-${COMPONENT}" >> "$GITHUB_ENV"   # GHCR needs lowercase
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          cat build.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (loaded locally, not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            GIT_SHA=${{ env.GIT_SHA }}
            GIT_REF=${{ env.GIT_REF }}
            BUILD_ID=${{ env.BUILD_ID }}
            BUILD_URL=${{ env.BUILD_URL }}
            CI_SYSTEM=${{ env.CI_SYSTEM }}
            BUILD_TIME=${{ env.BUILD_TIME }}
            SOURCE_URL=${{ env.SOURCE_URL }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Postscan Security Checks
        uses: ./.github/postscan
        with:
          image-tag: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          artifact-name: postscan-${{ matrix.component }}
          fail-on-findings: ${{ inputs.fail-on-findings != false && 'true' || 'false' }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && inputs.push-images != false
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request' && inputs.push-images != false
        run: docker push "${IMAGE}:${IMAGE_TAG}"

  # Run the images that were just pushed, exactly as a user would, and smoke-test them.
  verify:
    needs: build
    if: github.event_name != 'pull_request' && inputs.push-images != false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compute version and build provenance
        run: scripts/version.sh >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start PodPoll from the pushed images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          export IMAGE_REGISTRY="${REGISTRY}/${OWNER,,}"
          docker compose -p podpoll-ci -f local/compose.yaml -f local/compose.registry.yaml \
            --env-file local/env/dev.env up -d --wait --wait-timeout 120

      - name: Smoke test (right commit on both tiers, store reachable, a vote counts)
        run: scripts/smoke-test.sh http://localhost:8081 --expect-sha "$GIT_SHA" --expect-env dev --timeout 60

      - name: Container logs
        if: failure()
        run: docker compose -p podpoll-ci -f local/compose.yaml logs --no-color --tail 100

  pr-comment:
    needs: [prescan, build]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BLOCKING: ${{ needs.prescan.outputs.blocking }}
        with:
          script: |
            const version = process.env.VERSION || 'n/a';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ CI passed. PodPoll ${version} built and scanned (${process.env.BLOCKING || 0} blocking findings). Images are pushed after merge.`
            })

  report:
    needs: [prescan, test, build, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the scan reports
        uses: actions/download-artifact@v8
        with:
          pattern: '*scan*'
          path: scan-reports

      # One table for every scanner (scripts/security-report.py), suppressed findings included.
      - name: Security summary
        env:
          GIT_SHA: ${{ github.sha }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          args=()
          d=scan-reports/prescan-reports
          [[ -f $d/gitleaks-report.json ]] && args+=(--gitleaks "$d/gitleaks-report.json")
          [[ -f .gitleaksignore ]] && args+=(--gitleaks-ignore .gitleaksignore)
          [[ -f $d/trufflehog-report.json ]] && args+=(--trufflehog "$d/trufflehog-report.json")
          [[ -f $d/trivy-report-prescan.json ]] && args+=(--trivy "fs=$d/trivy-report-prescan.json")
          for c in api frontend node-agent; do
            f="scan-reports/postscan-${c}/trivy-report-postscan.json"
            [[ -f "$f" ]] && args+=(--trivy "image-${c}=${f}")
          done
          python3 scripts/security-report.py --out-dir security-report --version "${APP_VERSION:-n/a}" "${args[@]}"
          cat security-report/security-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the security summary
        uses: actions/upload-artifact@v7
        with:
          name: security-summary
          path: security-report/
          retention-days: 14

      - name: Generate Job Summary Table
        env:
          REPORT_TITLE: ${{ vars.REPORT_TITLE }}
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PRESCAN_RESULT: ${{ needs.prescan.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          APP_VERSION="${VERSION:-n/a}"
          TITLE="${REPORT_TITLE:-CI Report}"

          echo "### $TITLE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric / Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| App Name | $APP_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | $APP_VERSION |" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag | ${IMAGE_TAG:-n/a} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | $SHORT_SHA |" >> $GITHUB_STEP_SUMMARY
          echo "| Event Name | $EVENT_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| Prescan Result | $PRESCAN_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Result | $TEST_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Build + Postscan Result | $BUILD_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Verify Result | $VERIFY_RESULT |" >> $GITHUB_STEP_SUMMARY

      - name: Send Notification if Token is Set
        if: env.NOTIFY_TOKEN != ''
        run: |
          TOKEN_LEN=${#NOTIFY_TOKEN}
          echo "Notification sent (token length: $TOKEN_LEN)"
