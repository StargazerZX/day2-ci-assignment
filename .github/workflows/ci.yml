name: Day 2 CI
run-name: ${{ github.actor }} - running workflow

permissions:
  contents: read

env:
  APP_NAME: temperature

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version to use'
        required: true
        default: '3.13'
        type: choice
        options:
          - '3.12'
          - '3.13'
      create-package:
        description: 'Whether to create a package'
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '0 7 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ github.event.inputs.python-version || '3.13' }}
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with JUnit report
        id: run-tests
        run: pytest -v --junitxml=reports/junit.xml

      - name: Upload JUnit test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: reports/junit.xml
          retention-days: 5

      - name: Notify on test failure
        if: failure() && steps.run-tests.outcome == 'failure'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "🚨 Tests failed on $BRANCH_NAME"

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.inputs.create-package != 'false' }}
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute and set version
        id: set-version
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create package tarball
        env:
          VERSION: ${{ steps.set-version.outputs.version }}
        run: |
          mkdir -p dist
          tar -czvf dist/temperature-$VERSION.tar.gz temperature.py README.md

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist/temperature-*.tar.gz
          if-no-files-found: error

  verify:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: package
          path: dist

      - name: Extract and verify package
        run: |
          # Find the tarball in dist/ and extract it
          tar -xzvf dist/temperature-*.tar.gz
          
          # Run the required verification command
          python3 -c "from temperature import celsius_to_fahrenheit as c; assert c(100) == 212; print('Package OK')"

  pr-comment:
    needs: package
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.package.outputs.version }}
        with:
          script: |
            const version = process.env.VERSION || 'n/a';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ CI passed. Package version ${version} is ready.`
            })

  report:
    needs: [test, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
    steps:
      - name: Generate Job Summary Table
        env:
          REPORT_TITLE: ${{ vars.REPORT_TITLE }}
          VERSION: ${{ needs.package.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          APP_VERSION="${VERSION:-n/a}"
          TITLE="${REPORT_TITLE:-CI Report}"

          echo "### $TITLE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric / Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| App Name | temperature |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | $APP_VERSION \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | $SHORT_SHA \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| Event Name | $EVENT_NAME \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| Test Result | $TEST_RESULT \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| Package Result | $PACKAGE_RESULT \vert{}" >> $GITHUB_STEP_SUMMARY

      - name: Send Notification if Token is Set
        if: env.NOTIFY_TOKEN != ''
        run: |
          TOKEN_LEN=${#NOTIFY_TOKEN}
          echo "Notification sent (token length: $TOKEN_LEN)"