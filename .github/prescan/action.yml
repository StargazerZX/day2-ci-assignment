name: Security Scanning Pre-Checks
description: >
  Runs Gitleaks and TruffleHog on the git history and Trivy on the filesystem (dependencies,
  secrets, misconfigurations), uploads the JSON reports and, if asked, fails on blocking findings.

inputs:
  scan-path:
    description: 'Choose a specific path to scan. Defaults to the root of the repository.'
    required: false
  fail-on-findings:
    description: >
      'true' fails the step when there are blocking findings (any Gitleaks finding, a VERIFIED
      TruffleHog secret, or a fixable Trivy finding at trivy-severity). Default 'false': report only.
    required: false
    default: 'false'
  trivy-severity:
    description: 'Trivy severities that count as blocking.'
    required: false
    default: 'CRITICAL,HIGH'
  sonar_token:
    description: 'SonarQube Token'
    required: true
  artifact-name:
    description: 'Name of the uploaded report artifact (must be unique within a workflow run).'
    required: false
    default: 'prescan-reports'
outputs:
  gitleaks-report:
    description: 'Path to the generated Gitleaks JSON report'
    value: gitleaks-report.json
  trufflehog-report:
    description: 'Path to the generated TruffleHog JSON report'
    value: trufflehog-report.json
  trivy-report:
    description: 'Path to the generated Trivy JSON report'
    value: trivy-report-prescan.json
  blocking-findings:
    description: 'Number of blocking findings across all three tools'
    value: ${{ steps.scan.outputs.blocking-findings }}

runs:
  using: "composite"
  steps:
    - name: Install Security Tools
      shell: bash
      env:
        GITLEAKS_VERSION: "8.30.1"
        TRIVY_VERSION: "0.69.3"
        TRUFFLEHOG_VERSION: "3.95.5"
      run: |
        set -euo pipefail
        BIN="$HOME/.local/bin"
        TMP="$(mktemp -d)"
        mkdir -p "$BIN"
        echo "$BIN" >> "$GITHUB_PATH"

        # usage: fetch <base-url> <archive-name> <checksums-name> <binary-name>
        fetch() {
          local base="$1" archive="$2" sums="$3" binary="$4"
          curl -sSfL --retry 3 -o "$TMP/$archive" "$base/$archive"
          curl -sSfL --retry 3 -o "$TMP/$sums"    "$base/$sums"
          (cd "$TMP" && grep " ${archive}\$" "$sums" | sha256sum -c -)
          tar -xzf "$TMP/$archive" -C "$BIN" "$binary"
        }

        echo "Installing Gitleaks ${GITLEAKS_VERSION}..."
        fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}" \
          "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          "gitleaks_${GITLEAKS_VERSION}_checksums.txt" gitleaks

        echo "Installing Trivy ${TRIVY_VERSION}..."
        fetch "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}" \
          "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
          "trivy_${TRIVY_VERSION}_checksums.txt" trivy

        echo "Installing TruffleHog ${TRUFFLEHOG_VERSION}..."
        fetch "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}" \
          "trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" \
          "trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt" trufflehog

        echo "Verifying installations..."
        "$BIN/gitleaks" version
        "$BIN/trivy" --version
        "$BIN/trufflehog" --version

    # All scanning logic lives in scan.sh next to this file, so it can also run on a laptop
    # (labs/scan-local.sh). Inputs reach the script as environment variables, never pasted into
    # the shell script itself (that would be a template-injection hole).
    - name: Run Gitleaks, TruffleHog and Trivy
      id: scan
      shell: bash
      env:
        SCAN_TARGET: ${{ inputs.scan-path }}
        TRIVY_SEVERITY: ${{ inputs.trivy-severity }}
        FAIL_ON_FINDINGS: 'false'   # the gate step below decides, after the reports are uploaded
        REPORT_DIR: .
      run: '"$GITHUB_ACTION_PATH/scan.sh"'

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v6
      env:
       # GITHUB_TOKEN: ${{ inputs.secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ inputs.sonar_token }}

    - name: Upload Scan Reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          gitleaks-report.json
          trufflehog-report.json
          trivy-report-prescan.json
        if-no-files-found: warn

    - name: Security gate
      if: ${{ inputs.fail-on-findings == 'true' }}
      shell: bash
      env:
        BLOCKING: ${{ steps.scan.outputs.blocking-findings }}
      run: |
        if [[ "${BLOCKING:-0}" != "0" ]]; then
          echo "::error::${BLOCKING} blocking security finding(s). See the job summary and the report artifact."
          exit 1
        fi
        echo "No blocking findings."
